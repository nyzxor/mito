[project]
name = "mito"
version = "0.0.1"
description = "MITO: a self-hosted, cost-frugal, self-improving agent harness with a metabolism and a Handbrake."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guilherme" }]

# Runtime dependencies. Every entry must be justified in docs/adr/.
dependencies = [
  "httpx>=0.27",         # ADR-0002 (Handbrake API client), ADR-0004 (model client), ADR-0005 (egress)
  "uvicorn>=0.30",       # ADR-0002 (Handbrake ASGI server)
  "pydantic>=2.7",       # ADR-0012 (schemas, config validation)
  "cryptography>=43",    # ADR-0007 (Ed25519 signatures)
  "keyring>=25",         # ADR-0007 (operator key in OS keyring)
]

[project.optional-dependencies]
# Chosen in Phase 2 by measurement (ADR-0005).
readability = ["trafilatura>=1.9"]
# Off by default (ADR-0009).
embeddings = []

[project.scripts]
mito = "mito.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "hypothesis>=6",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mito", "handbrake"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["mito", "handbrake", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC", "T20"]
# S101: assert is fine in tests; T20: no print outside the CLI.
per-file-ignores = { "**/tests/**" = ["S101", "T20"], "evals/**" = ["S101", "T20"], "mito/cli/**" = ["T20"] }

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mito", "handbrake"]
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["handbrake/tests", "mito", "evals"]
markers = [
  "unit: fast, no IO",
  "handbrake: Handbrake core tests (part of the pinned tree)",
  "wiring: unplugged-wire detection",
  "smoke: 20-case golden smoke set on the replay model",
  "safety: full corrigibility suite",
  "docker: requires a Docker daemon",
  "chaos: destructive/slow chaos tests",
]
