# Model registry (DESIGN §7, ADR-0004). No model names are hard-coded anywhere else.
# Prices are USD per 1M tokens and feed the ATP ledger. Keys are credential HANDLES (vault), never secrets.
# provider = "openai_compatible" (llama.cpp, Ollama /v1, OpenRouter, DeepSeek, Groq, OpenAI, ...)
#          | "anthropic"         (native Messages API: cache_control breakpoints, thinking round-trip)
# Phase 0 DRAFT — the operator fills real entries in Phase 3; every entry must pass the tool-use eval.
schema_version = 1

[router]
escalation_max = 2
frontier_calls_per_day = 5
# task class -> preferred tier order (router still respects metabolic state)
classify = ["L0", "L1"]
extract  = ["L1", "L2"]
draft    = ["L1", "L2"]
plan     = ["L1", "L2", "L3"]
review   = ["L2", "L3"]
code     = ["L1", "L2", "L3"]

# ---- L1: local -------------------------------------------------------------------------------
[[model]]
id = "local-llamacpp"
tier = "L1"
provider = "openai_compatible"
base_url_env = "MITO_LOCAL_BASE_URL"     # default http://127.0.0.1:8080/v1 (llama-server)
model = "default"                         # llama.cpp serves whatever is loaded
context_window = 32768
price_in = 0.0                            # local: priced via metabolism.toml electricity model
price_out = 0.0
capabilities = ["tools", "json_schema"]
params = { temperature = 0.2, max_tokens_name = "max_tokens", parallel_tool_calls = false }

