# Local Linux dev. Same isolation as production: loopback publish, internal network,
# egress-proxy is the only service on a network with an external route.

name: mito-dev

networks:
  internal:
    internal: true
  egress:
    internal: false

volumes:
  mito-home:

services:
  handbrake:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "65532:65532"
    networks: [internal]
    volumes:
      - mito-home:/var/lib/mito
    environment:
      MITO_HOME: /var/lib/mito
      MITO_DEV_MODE: "0"
      MITO_ALLOW_NONLOOPBACK_BIND: "1"
      MITO_HANDBRAKE_BIND: "0.0.0.0:8710"
    ports:
      - "127.0.0.1:8710:8710"
    command: ["up", "--no-runtime"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "65532:65532"
    networks: [internal]
    volumes:
      - mito-home:/var/lib/mito
    environment:
      MITO_HOME: /var/lib/mito
      MITO_DEV_MODE: "0"
      MITO_HANDBRAKE_URL: http://handbrake:8710
    entrypoint: ["python", "-m", "mito.runtime_main"]
    depends_on: [handbrake]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  egress-proxy:
    build:
      context: ../egress-proxy
      dockerfile: Dockerfile
    user: "65532:65532"
    networks: [internal, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
